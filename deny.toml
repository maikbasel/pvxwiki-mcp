# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[advisories]
yanked = "deny"

[licenses]
# Permissive licences only. Extend deliberately when a dependency needs another one.
allow = ["MIT", "MIT-0", "Apache-2.0", "Unicode-3.0"]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
