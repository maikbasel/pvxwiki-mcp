# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[advisories]
yanked = "deny"

[licenses]
# Permissive licences only. Extend deliberately when a dependency needs another one.
# ISC: rustls and its certificate verifier (the scraper's TLS stack).
allow = ["MIT", "MIT-0", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-3-Clause", "ISC"]
unused-allowed-license = "allow"
# Mozilla's CA root certificates (data, not code), used by rustls's certificate verifier.
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
