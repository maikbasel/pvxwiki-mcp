[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/maikbasel/pvxwiki-mcp"
publish = false

[workspace.dependencies]
pvxwiki-parser = { path = "crates/parser", version = "0.1.0" }
pvxwiki-store = { path = "crates/store", version = "0.1.0" }
pvxwiki-server = { path = "crates/server", version = "0.1.0" }
pvxwiki-scraper = { path = "crates/scraper", version = "0.1.0" }
pvxwiki-admin = { path = "crates/admin", version = "0.1.0" }
parse-wiki-text-2 = "0.2.0"
tracing = "0.1.44"
insta = "1.49"
# rmcp's 3.x line has frequent breaking changes: pinned exactly.
rmcp = { version = "=3.7.0", default-features = false }
schemars = "1"
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7", features = ["limit", "set-header", "timeout", "trace"] }
governor = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
deadpool-sqlite = "0.14"
rusqlite_migration = { version = "2.6", features = ["from-directory"] }
include_dir = "0.7"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "query"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

# Enforces .claude/rules/production-grade.md and logging.md at compile time.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
